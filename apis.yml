    url: https://developer.dol.gov/
- name: DOL Veterans Employment API
  description: 'Access VETS-4212 and VETS-100 datasets containing veteran employment data reported by federal contractors and subcontractors, including hiring benchmarks and veteran representation across contractor organizations.

    '
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.dol.gov/others/
  baseURL: https://api.dol.gov/V1/
