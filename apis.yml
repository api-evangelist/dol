    url: https://developer.dol.gov/health-and-safety/
- name: DOL Public Workforce System API
  description: 'Access Public Workforce System data including Initial Unemployment Insurance (UI) Claims, Workforce Investment Act data, job openings, and workforce development program information from the Employment and Training Administration (ETA).

    '
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.dol.gov/
  baseURL: https://api.dol.gov/V1/
  tags:
