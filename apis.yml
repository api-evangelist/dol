apis:
- name: DOL Employment Statistics API
  description: 'Access to Current Employment Statistics (CES), Current Population Survey (CPS), Occupational Employment Statistics Survey (OES), Quarterly Census Employment and Wage (CEW), and Consumer Price Indexes (CPI) from the Bureau of Labor Statistics via the DOL centralized API.

    '
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.dol.gov/
  baseURL: https://api.dol.gov/V1/
  tags:
  - Employment
  - Statistics
  - BLS
  - CPI
  - Wages
  properties:
  - type: Documentation
    url: https://developer.dol.gov/
  - type: Authentication
    url: https://developer.dol.gov/accessing-the-apis-using-http-requests/
- name: DOL OSHA Enforcement API
  description: 'Access OSHA inspection and enforcement data including inspection details, violations, citations, penalties, and accident injury reports. Covers all OSHA compliance actions with summary information about inspections conducted across U.S. workplaces.

    '
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.dol.gov/health-and-safety/
  baseURL: https://api.dol.gov/V1/
  tags:
  - OSHA
  - Safety
  - Health
  - Enforcement
  - Inspection
  tags_raw:
  - OSHA
  - Safety
  - Health
  - Enforcement
  - Inspections
  properties:
  - type: Documentation
    url: https://developer.dol.gov/health-and-safety/
- name: DOL Wage and Hour Compliance API
  description: 'Access Wage and Hour Division (WHD) compliance action data covering all concluded compliance actions since FY 2005, including back wages, violations, and employer information. Also includes Farm Labor Contractor data and Wage and Hour Publications System.

    '
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.dol.gov/
  baseURL: https://api.dol.gov/V1/
  tags:
  - Wages
  - Compliance
  - WHD
  - Labor Standards
  properties:
  - type: Documentation
    url: https://developer.dol.gov/
- name: DOL H-1B Foreign Labor Certification API
  description: 'Access Labor Condition Application (LCA) data collected by the Employment and Training Administration''s Office of Foreign Labor Certification (OFLC) covering H-1B, H-1B1, E-3, H-2A, H-2B, and D-1 visa categories. Includes employer, wage, and job data.

    '
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.dol.gov/agencies/eta/foreign-labor/performance
  baseURL: https://api.dol.gov/V1/
  tags:
  - H-1B
  - Foreign Labor
  - Visa
  - Immigration
  - OFLC
  tags_raw:
  - H-1B
  - Foreign Labor
  - Visas
  - Immigration
  - OFLC
  properties:
  - type: Documentation
    url: https://www.dol.gov/agencies/eta/foreign-labor/performance
- name: DOL Mine Safety and Health API
  description: 'Access Mine Safety and Health Administration (MSHA) data including mine-by-mine information, accidents and injuries, inspections, violations, assessments, employment and production reports. Covers Full Mine Information, Basic Mine Information, Mine Violations, and Mine Inspections.

    '
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.dol.gov/health-and-safety/
  baseURL: https://api.dol.gov/V1/
