- name: DOL Sweat and Toil API
  description: 'Access the International Labor Affairs Bureau (ILAB) Sweat and Toil data covering child labor and forced labor worldwide, including goods produced with child or forced labor by country and good, sourced from ILAB''s annual reports.

    '
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
